<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yutnori 3D — 3 Player</title>
<style>
:root{
  --bg:#071711;--panel:#0d2118;--panel2:#112b20;--gold:#d3a94f;--cream:#f1e1b4;
  --wood:#4a2f20;--line:#3b261b;--red:#d44732;--blue:#2476a8;--green:#3f8a54;
  --text:#f5edcf;--muted:#b8ae89;--shadow:0 18px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Segoe UI,sans-serif;background:
radial-gradient(circle at 20% 10%,#133328 0,transparent 30%),linear-gradient(135deg,#06130e,#020907 75%);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:18px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:8px 2px 18px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-family:Georgia,serif;font-size:clamp(1.6rem,3vw,2.5rem);margin:0}
.logo-stick{width:18px;height:58px;border-radius:12px;background:linear-gradient(90deg,#a76728,#f2bd59,#8c501d);transform:rotate(12deg);box-shadow:0 7px 12px #0008;display:grid;place-items:center;color:#29160a;font-weight:900}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #816b3c;background:#0f241a;color:var(--cream);border-radius:12px;padding:10px 14px;font-weight:800}
.btn:hover:not(:disabled){background:#173224}
.btn.gold{background:var(--gold);color:#1a1206;border-color:#f0cf7a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:minmax(560px,1fr) 360px;gap:18px}
.stage{perspective:1300px;min-height:700px;display:grid;place-items:center}
.board-wrap{width:min(880px,96%);transform:rotateX(10deg);transform-origin:center bottom;filter:drop-shadow(0 35px 35px rgba(0,0,0,.45))}
.board-rim{background:linear-gradient(145deg,#2e1c13,#5b3824);padding:18px;border-radius:20px;box-shadow:inset 0 0 0 3px #1f120d}
.board{position:relative;aspect-ratio:1.18/1;background:
linear-gradient(145deg,#dbc791,#c8ae70);border:3px solid #25150e;border-radius:8px;overflow:visible}
.board:before{content:"";position:absolute;inset:0;background:
repeating-linear-gradient(100deg,transparent 0 28px,rgba(80,55,25,.035) 29px 31px,transparent 32px 64px);pointer-events:none}
#boardSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.route{stroke:var(--line);stroke-width:1.2;fill:none}
.route.short{stroke-width:1.1}
.node{position:absolute;width:4.7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
background:radial-gradient(circle at 35% 25%,#68442d,#341f15 65%);border:2px solid #211209;box-shadow:0 5px 6px #0005}
.node.corner,.node.center{width:7%;background:radial-gradient(circle at 40% 30%,#21140e,#090604 70%);border:3px solid var(--gold);box-shadow:0 6px 8px #0008}
.node.valid{animation:pulse 1s infinite}
.node.suggested{outline:4px solid #fff8;box-shadow:0 0 0 10px rgba(211,169,79,.18),0 6px 8px #0008}
.node.landing{outline:4px solid var(--gold);animation:pulse 1s infinite}
.suggestion-path{stroke:#f6d36f;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:3 2;fill:none;filter:drop-shadow(0 0 2px #000)}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(211,169,79,.15),0 6px 8px #0008}}
.piece{position:absolute;width:6.6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);z-index:8;
border:3px solid rgba(255,255,255,.9);box-shadow:0 7px 0 rgba(0,0,0,.25),0 10px 16px #0007;
display:grid;place-items:center;color:#fff;font-weight:900;transition:left .38s ease,top .38s ease,transform .18s}
.piece.red{background:radial-gradient(circle at 35% 20%,#ff886d,var(--red) 55%,#8c1d13)}
.piece.blue{background:radial-gradient(circle at 35% 20%,#79c3ed,var(--blue) 55%,#0d3e5e)}
.piece.green{background:radial-gradient(circle at 35% 20%,#9ed9aa,var(--green) 55%,#1e4d2b)}
.piece img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.piece.selectable{outline:5px solid var(--gold);animation:bob .8s infinite}
.piece.recommended{outline:6px solid #fff;box-shadow:0 0 0 9px rgba(211,169,79,.32),0 10px 16px #0007}
@keyframes bob{50%{margin-top:-6px}}
.piece .count{position:absolute;right:-8px;top:-8px;background:#120c08;color:#fff;border:2px solid #fff;border-radius:999px;min-width:23px;height:23px;display:grid;place-items:center;font-size:.72rem;padding:0 4px}
.home-label{position:absolute;color:#4d351e;font-family:Georgia,serif;font-weight:800;font-size:.9rem}
.home-label.start{right:3%;bottom:2%}.home-label.finish{right:3%;bottom:8%}
.side{display:grid;gap:12px;align-content:start}
.card{background:linear-gradient(180deg,rgba(16,38,28,.95),rgba(8,24,17,.96));border:1px solid #4e482d;border-radius:18px;padding:15px;box-shadow:var(--shadow)}
.turn-card{border-left:7px solid var(--turn-color,var(--blue))}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
.turn-name{font-family:Georgia,serif;font-size:1.65rem;margin:4px 0 5px}
.status{color:#d1c7a6;line-height:1.4;min-height:42px}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.score{background:#0b1b13;border:1px solid #42513c;border-radius:12px;padding:8px;text-align:center;font-size:.78rem}
.score.active{outline:2px solid var(--score-color)}
.score strong{display:block;font-size:1.2rem;margin-top:3px}
.sticks{height:135px;display:flex;gap:10px;align-items:center;justify-content:center;perspective:700px}
.stick{position:relative;width:34px;height:112px;border-radius:17px;
background:linear-gradient(100deg,#7c3f16 0%,#c17a2f 16%,#e8ad54 42%,#f4c876 50%,#e8ad54 58%,#a5651f 84%,#7c3f16 100%);
border:2px solid #5a310f;box-shadow:6px 10px 0 #0003,inset -5px 0 9px rgba(0,0,0,.3),inset 4px 0 7px rgba(255,255,255,.35);
transition:.65s;overflow:hidden}
.stick.flat{background:linear-gradient(100deg,#b9803f 0%,#e9c48b 16%,#ffedbf 42%,#fff8e4 50%,#ffedbf 58%,#dcae6c 84%,#b9803f 100%);
box-shadow:6px 10px 0 #0003,inset 0 2px 5px rgba(255,255,255,.5)}
.stick .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly}
.stick .round-face .mark{color:#2a1608;font-weight:900;font-size:1.05rem;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.2)}
.stick .round-face .mark:nth-child(1){transform:rotate(-6deg)}
.stick .round-face .mark:nth-child(2){transform:rotate(4deg)}
.stick .round-face .mark:nth-child(3){transform:rotate(-3deg)}
.stick .flat-face{display:none}
.stick .flat-face .mark{color:#2a1608;font-weight:900;font-size:1.15rem}
.stick.flat .round-face{display:none}
.stick.flat .flat-face{display:flex}
.stick:not(.marked) .flat-face{visibility:hidden}
.sticks.tossing .stick:nth-child(1){transform:translateY(-34px) rotate(520deg)}
.sticks.tossing .stick:nth-child(2){transform:translateY(-50px) rotate(-630deg)}
.sticks.tossing .stick:nth-child(3){transform:translateY(-38px) rotate(690deg)}
.sticks.tossing .stick:nth-child(4){transform:translateY(-54px) rotate(-580deg)}
.result{font-family:Georgia,serif;font-size:1.55rem;text-align:center;min-height:36px;color:var(--cream)}
.throw-btn{width:100%;padding:13px}
.pending{display:flex;flex-wrap:wrap;gap:7px;min-height:39px}
.chip{border:1px solid #7c6737;background:#15271d;color:var(--cream);border-radius:999px;padding:7px 11px;font-weight:800}
.chip.active{background:var(--gold);color:#1c1407}
.log{max-height:160px;overflow:auto;font-size:.84rem;color:#cfc5a3;line-height:1.45}
.log div{padding:5px 0;border-bottom:1px dashed #3b4c3a}
.hint-card{border-left:5px solid var(--gold)}
.hint-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint-text{color:#d8cfad;line-height:1.45;font-size:.9rem;min-height:42px}
.rank-badge{display:inline-grid;place-items:center;margin-top:4px;padding:2px 7px;border-radius:999px;background:#d3a94f;color:#191006;font-weight:900;font-size:.7rem}
.sound-on{background:#173224!important;border-color:#d3a94f!important}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:50}
.modal.show{display:grid}
.modal-box{width:min(650px,100%);max-height:90vh;overflow:auto;background:#0f241a;border:1px solid #6f6139;border-radius:20px;padding:20px;box-shadow:0 25px 80px #000}
.modal-box h2{font-family:Georgia,serif;margin:0 0 12px;font-size:2rem}
.rules-grid{display:grid;gap:10px}
.rule{background:#0a1a12;border:1px solid #3c513c;border-radius:13px;padding:12px}
.rule h3{margin:0 0 5px;font-size:1rem;color:#f3d58b}.rule p{margin:0;color:#c8bea0;line-height:1.45;font-size:.9rem}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{font-weight:800;font-size:.86rem;color:#e4d9b7}
input,select{width:100%;margin-top:5px;border:1px solid #6d6040;background:#08170f;color:#f4ebd0;border-radius:10px;padding:10px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;grid-column:1/-1}
.switch input{width:auto;transform:scale(1.25);margin:0}
.modal-actions{display:flex;gap:9px;margin-top:14px}
.modal-actions .btn{flex:1}
.winner{text-align:center}.winner .emoji{font-size:2.6rem}
@media(max-width:1050px){.layout{grid-template-columns:1fr}.stage{min-height:auto}.board-wrap{width:min(840px,100%)}.side{grid-template-columns:repeat(2,1fr)}.turn-card,.throw-card{grid-column:span 1}.moves-card,.log-card{grid-column:span 2}}
@media(max-width:650px){.app{padding:9px}.topbar{align-items:flex-start}.layout{display:block}.stage{padding-top:8px}.board-wrap{transform:rotateX(5deg)}.board-rim{padding:9px}.side{display:grid;grid-template-columns:1fr;margin-top:12px}.moves-card,.log-card{grid-column:span 1}.settings-grid{grid-template-columns:1fr}.piece{width:8.2%}.node{width:5.8%}.node.corner,.node.center{width:8.2%}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo-stick">×</div><h1>Yutnori</h1></div>
    <div class="actions">
      <button class="btn" id="soundBtn" aria-pressed="true">🔊 Sound</button>
      <button class="btn" id="rulesBtn">Rules</button>
      <button class="btn" id="settingsBtn">Settings</button>
      <button class="btn" id="restartBtn">New Game</button>
    </div>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="board-wrap">
        <div class="board-rim">
          <div class="board" id="board">
            <svg id="boardSvg" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
            <div class="home-label finish">FINISH</div>
            <div class="home-label start">START →</div>
          </div>
        </div>
      </div>
    </section>

    <aside class="side">
      <section class="card turn-card" id="turnCard">
        <div class="eyebrow" id="turnLabel">Current turn</div>
        <div class="turn-name" id="turnName">Blue Team</div>
        <div class="status" id="status">Throw the four yut sticks.</div>
        <div class="scores">
          <div class="score" id="score0"><span id="name0">Blue Team</span><strong id="finished0">0/4</strong></div>
          <div class="score" id="score1"><span id="name1">Red Team</span><strong id="finished1">0/4</strong></div>
          <div class="score" id="score2"><span id="name2">Green Team</span><strong id="finished2">0/4</strong></div>
        </div>
      </section>

      <section class="card throw-card">
        <div class="sticks" id="sticks">
          <div class="stick marked">
            <div class="face round-face"><span class="mark">×</span><span class="mark">×</span><span class="mark">×</span></div>
            <div class="face flat-face"><span class="mark">×</span></div>
          </div>
          <div class="stick">
            <div class="face round-face"><span class="mark">×</span><span class="mark">×</span><span class="mark">×</span></div>
            <div class="face flat-face"></div>
          </div>
          <div class="stick">
            <div class="face round-face"><span class="mark">×</span><span class="mark">×</span><span class="mark">×</span></div>
            <div class="face flat-face"></div>
          </div>
          <div class="stick">
            <div class="face round-face"><span class="mark">×</span><span class="mark">×</span><span class="mark">×</span></div>
            <div class="face flat-face"></div>
          </div>
        </div>
        <div class="result" id="resultText">Ready</div>
        <button class="btn gold throw-btn" id="throwBtn">Throw the Yut</button>
      </section>

      <section class="card moves-card">
        <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:8px">
          <strong id="movesTitle">Available moves</strong><span class="eyebrow" id="phaseText">Throw phase</span>
        </div>
        <div class="pending" id="pendingList"></div>
      </section>

      <section class="card hint-card">
        <div class="hint-row"><strong id="hintTitle">Suggested move</strong><button class="btn" id="hintBtn">Show hint</button></div>
        <div class="hint-text" id="hintText">Throw the sticks to receive a suggestion.</div>
      </section>

      <section class="card log-card">
        <strong id="logTitle">Game log</strong>
        <div class="log" id="log"></div>
      </section>
    </aside>
  </div>
</div>

<div class="modal" id="rulesModal">
  <div class="modal-box">
    <h2 id="rulesTitle">Complete Yutnori Rules</h2>
    <div class="rules-grid" id="rulesGrid"></div>
    <div class="modal-actions"><button class="btn gold" id="closeRules" data-close="rulesModal">Close</button></div>
  </div>
</div>

<div class="modal" id="settingsModal">
  <div class="modal-box">
    <h2 id="settingsTitle">Game Settings</h2>
    <div class="settings-grid">
      <label><span id="blueNameLabel">Blue team name</span><input id="p0Name" value="Blue Team" maxlength="20"></label>
      <label><span id="bluePhotoLabel">Blue team photo</span><input id="p0Photo" type="file" accept="image/*"></label>
      <label><span id="redNameLabel">Red team name</span><input id="p1Name" value="Red Team" maxlength="20"></label>
      <label><span id="redPhotoLabel">Red team photo</span><input id="p1Photo" type="file" accept="image/*"></label>
      <label><span id="greenNameLabel">Green team name</span><input id="p2Name" value="Green Team" maxlength="20"></label>
      <label><span id="greenPhotoLabel">Green team photo</span><input id="p2Photo" type="file" accept="image/*"></label>
      <label><span id="languageLabel">Language</span>
        <select id="language">
          <option value="en">English</option>
          <option value="bn">বাংলা</option>
          <option value="ko">한국어</option>
        </select>
      </label>
      <label class="switch"><span id="backDoLabel">Enable Back Do hidden rule</span><input id="backDo" type="checkbox" checked></label>
      <label class="switch"><span id="soundLabel">Enable sound effects</span><input id="soundEnabled" type="checkbox" checked></label>
    </div>
    <div class="modal-actions"><button class="btn" id="cancelSettings" data-close="settingsModal">Cancel</button><button class="btn gold" id="saveSettings">Save</button></div>
  </div>
</div>

<div class="modal" id="winnerModal">
  <div class="modal-box winner">
    <div class="emoji">🎊 🥁 🎊</div>
    <h2 id="winnerText"></h2>
    <p id="winnerSub"></p>
    <button class="btn gold" id="continueGame">Continue Game</button>
    <button class="btn gold" id="playAgain" style="display:none">Play Again</button>
  </div>
</div>

function t(k,vars={}){

function addLog(msg){const d=document.createElement("div");d.textContent=msg;$("log").prepend(d)}

let audioCtx=null;
function sound(kind){
 if(!state.sound)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const now=audioCtx.currentTime;
  const patterns={click:[[420,.05]],toss:[[180,.08],[260,.08],[360,.1]],move:[[330,.08],[520,.1]],capture:[[620,.09],[430,.09],[760,.15]],win:[[523,.12],[659,.12],[784,.2]]};
  (patterns[kind]||patterns.click).forEach(([freq,dur],i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;o.type="sine";g.gain.setValueAtTime(.0001,now+i*.09);g.gain.exponentialRampToValueAtTime(.12,now+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+dur);o.connect(g).connect(audioCtx.destination);o.start(now+i*.09);o.stop(now+i*.09+dur+.02)});
 }catch(e){}
}
function activePlayers(){return state.players.map((_,i)=>i).filter(i=>!state.rankings.includes(i))}
function nextActive(from){const active=activePlayers();if(!active.length)return from;for(let n=1;n<=state.players.length;n++){const i=(from+n)%state.players.length;if(active.includes(i))return i}return active[0]}

}

function addLine(a,b,short=false){

 const l=document.createElementNS("http://www.w3.org/2000/svg","line");
 l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);
 l.setAttribute("class",short?"route short":"route");$("boardSvg").appendChild(l);
}

function buildBoard(){
 $("boardSvg").innerHTML="";
 document.querySelectorAll(".node,.piece").forEach(e=>e.remove());
 const outer=routes.outer;
 for(let i=0;i<outer.length-1;i++)addLine(outer[i],outer[i+1]);
 [["N5","A1"],["A1","A2"],["A2","C"],["C","D1"],["D1","D2"],["D2","N13"],
  ["N9","B1"],["B1","B2"],["B2","C"],["C","E1"],["E1","E2"],["E2","N17"]].forEach(([a,b])=>addLine(a,b,true));
 Object.entries(coords).forEach(([id,[x,y]])=>{
   if(id==="N1")return; // N1 and N17 are the same physical corner (start/finish); only draw it once
   const n=document.createElement("div");n.className="node";n.dataset.node=id;n.style.left=x+"%";n.style.top=y+"%";
   if(["N5","N9","N13","N17"].includes(id))n.classList.add("corner");

 });

function reset(){

 $("resultText").textContent=t("ready");$("log").innerHTML="";addLog(`${state.players[0].name} starts.`);$("winnerModal").classList.remove("show");
 $("sticks").classList.remove("tossing");[...$("sticks").children].forEach(s=>s.classList.remove("flat"));

function throwResult(){
 const flat=Array.from({length:4},()=>Math.random()<.5);
 const c=flat.filter(Boolean).length;
 if(c===0)return {type:"MO",steps:5,bonus:true,flat};
 if(c===1){
   if(state.backDo && flat[0])return {type:"BACK_DO",steps:-1,bonus:false,flat};
   return {type:"DO",steps:1,bonus:false,flat};
 }
 if(c===2)return {type:"GAE",steps:2,bonus:false,flat};
 if(c===3)return {type:"GEOL",steps:3,bonus:false,flat};
 return {type:"YUT",steps:4,bonus:true,flat};
}

function toss(){
 if(state.tossing||state.phase!=="throw"||state.gameOver)return;
 state.tossing=true;sound("toss");$("throwBtn").disabled=true;$("sticks").classList.add("tossing");
 setTimeout(()=>{
   const r=throwResult();r.id=Math.random().toString(36).slice(2);
   [...$("sticks").children].forEach((s,i)=>{s.classList.toggle("flat",r.flat[i])});
   $("sticks").classList.remove("tossing");$("resultText").textContent=`${resultName(r.type)} · ${r.steps>0?"+":""}${r.steps}`;
   state.pending.push(r);addLog(`${state.players[state.current].name}: ${resultName(r.type)}`);
   state.tossing=false;

   const noBoardPiece=!state.players[state.current].pieces.some(pc=>pc.status==="board");
   if(r.type==="BACK_DO" && noBoardPiece){
     // Back Do cannot be used with no piece on the board: discard it instead of getting stuck.
     state.pending.pop();
     addLog(`${state.players[state.current].name}: Back Do wasted (no piece on board).`);
     if(state.pending.length===0){
       if(state.bonusAfterMoves){state.bonusAfterMoves=false;state.phase="throw";$("status").textContent=t("capture")}
       else endTurn();
     }else{state.phase="move";$("status").textContent=t("chooseResult")}
     render();
     return;
   }

   if(r.bonus){$("status").textContent=t("bonus",{result:resultName(r.type)});state.phase="throw"}
   else{state.phase="move";$("status").textContent=t("chooseResult")}
   render();
 },700);
}

function nodeOf(p){return p.status==="board"?routes[p.route][p.index]:null}
function stackAt(player,node){return state.players[player].pieces.filter(p=>p.status==="board"&&nodeOf(p)===node)}

function destination(p,steps){
 if(steps===-1){
   if(p.status!=="board")return {valid:false};
   // Back Do always moves exactly one node back along the piece's current route.
   // Index 0 on any route is always "N1" (the first space past start), so being
   // there and moving back one node means returning to Start, which finishes it.
   if(p.index<=0)return {valid:true,finish:true,backFinish:true};
   const idx=p.index-1;
   return {valid:true,node:routes[p.route][idx],route:p.route,index:idx,back:true};
 }
 if(p.status==="finished")return {valid:false};
 if(p.status==="home"){
   const idx=steps-1;
   return idx>=routes.outer.length?{valid:true,finish:true}:{valid:true,node:routes.outer[idx],route:"outer",index:idx};
 }
 let route=p.route,index=p.index,target=index+steps;
 if(target>=routes[route].length)return {valid:true,finish:true};
 return {valid:true,node:routes[route][target],route,index:target};
}

function activateShortcut(d){
 if(d.finish||d.back)return d;
 if(d.route==="outer"&&d.node==="N5")return {...d,route:"low",index:routes.low.indexOf("N5")};
 if(d.route==="outer"&&d.node==="N9")return {...d,route:"high",index:routes.high.indexOf("N9")};
 return d;
}

function validPieces(result){
 const list=[],seen=new Set();
 state.players[state.current].pieces.forEach(p=>{
   if(p.status==="finished")return;
   const key=p.status==="board"?nodeOf(p):p.id;
   if(p.status==="board"&&seen.has(key))return;
   if(p.status==="board")seen.add(key);
   if(destination(p,result.steps).valid)list.push(p);
 });
 return list;
}

function selectResult(id){
 if(state.phase!=="move")return;
 state.selected=state.pending.find(r=>r.id===id)||null;state.hintPieceId=null;sound("click");
 const v=state.selected?validPieces(state.selected):[];
 $("status").textContent=v.length?t("choosePiece",{result:resultName(state.selected.type)}):t("noValid",{result:resultName(state.selected.type)});
 render();
}

function movePiece(id){
 if(state.phase!=="move"||!state.selected)return;
 const p=state.players[state.current].pieces.find(x=>x.id===id);
 if(!p||!validPieces(state.selected).some(x=>x.id===id))return;
 const origin=nodeOf(p),moving=p.status==="board"?stackAt(state.current,origin):[p];
 const d=activateShortcut(destination(p,state.selected.steps));

 moving.forEach(x=>{
   if(d.finish){x.status="finished";x.index=-1}
   else{x.status="board";x.route=d.route;x.index=d.index}
 });

 let captured=false;
 if(!d.finish){
   state.players.forEach((op,oi)=>{
     if(oi===state.current)return;
     op.pieces.forEach(x=>{
       if(x.status==="board"&&nodeOf(x)===d.node){x.status="home";x.route="outer";x.index=-1;captured=true}
     })
   })
 }
 const used=state.selected;
 state.pending=state.pending.filter(x=>x.id!==used.id);state.selected=null;
 sound("move");addLog(`${state.players[state.current].name} used ${resultName(used.type)}.`);
 if(captured){sound("capture");state.bonusAfterMoves=true;$("status").textContent=t("capture");addLog(t("capture"))}
 if(state.players[state.current].pieces.every(x=>x.status==="finished")){handlePlacement();return}
 if(state.pending.length===0){
   if(state.bonusAfterMoves){state.bonusAfterMoves=false;state.phase="throw";$("status").textContent=t("capture")}
   else endTurn()
 }else{$("status").textContent=t("chooseResult");state.phase="move"}
 render();
}

function endTurn(){
 addLog(`${state.players[state.current].name}: ${t("turnEnd")}`);
 state.current=nextActive(state.current);state.phase="throw";state.pending=[];state.selected=null;state.hintPieceId=null;$("resultText").textContent=t("ready");$("status").textContent=t("throwPrompt");
}

function handlePlacement(){
 const winner=state.current;if(!state.rankings.includes(winner))state.rankings.push(winner);sound("win");
 state.pending=[];state.selected=null;state.hintPieceId=null;
 if(state.rankings.length===1){
  $("winnerText").textContent=t("firstWinner",{name:state.players[winner].name});
  $("winnerSub").textContent=t("firstWinnerSub");
  $("continueGame").style.display="inline-block";$("playAgain").style.display="none";
  $("winnerModal").classList.add("show");state.phase="paused";
 }else{
  const third=activePlayers()[0];if(third!==undefined)state.rankings.push(third);
  state.gameOver=true;state.phase="finished";
  $("winnerText").textContent=t("finalWinner",{name:state.players[winner].name});
  $("winnerSub").textContent=t("finalWinnerSub",{third:third===undefined?"":state.players[third].name});
  $("continueGame").style.display="none";$("playAgain").style.display="inline-block";$("winnerModal").classList.add("show");
 }
 render();
}

function homePos(player,index){

 return sets[player][index];
}

function clearSuggestions(){
 document.querySelectorAll(".node.suggested,.node.landing").forEach(n=>n.classList.remove("suggested","landing"));
 document.querySelectorAll(".suggestion-path").forEach(n=>n.remove());
}
function pathNodesFor(p,d){
 if(d.finish)return [];
 const route=routes[d.route];
 if(p.status==="home")return route.slice(0,d.index+1);
 const start=Math.max(0,p.index);return route.slice(Math.min(start,d.index),Math.max(start,d.index)+1);
}
function drawSuggestion(p,result,strong=false){
 const d=activateShortcut(destination(p,result.steps));if(!d.valid)return;
 const nodes=pathNodesFor(p,d);
 nodes.forEach((id,i)=>{const n=document.querySelector(`[data-node="${id}"]`);if(n)n.classList.add(i===nodes.length-1?"landing":"suggested")});
 for(let i=0;i<nodes.length-1;i++){const [x1,y1]=coords[nodes[i]],[x2,y2]=coords[nodes[i+1]];const l=document.createElementNS("http://www.w3.org/2000/svg","line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("class","suggestion-path");$("boardSvg").appendChild(l)}
}
function bestSuggestion(){
 let best=null;
 state.pending.forEach(r=>validPieces(r).forEach(p=>{const d=activateShortcut(destination(p,r.steps));let score=r.steps;
  if(d.finish)score+=100;
  if(!d.finish){state.players.forEach((op,oi)=>{if(oi!==state.current&&op.pieces.some(x=>x.status==="board"&&nodeOf(x)===d.node))score+=60});if(["N5","N9"].includes(d.node))score+=20}
  if(p.status==="home")score+=3;
  if(!best||score>best.score)best={r,p,d,score};
 }));
 return best;
}
function renderHint(){

 $("hintText").textContent=state.phase==="move"?(h?t("hintChoose",{result:resultName(h.r.type),piece:Number(h.p.id.split("-")[1])+1}):t("hintNone")):t("hintThrow");
}

function renderPieces(){
 clearSuggestions();document.querySelectorAll(".piece").forEach(e=>e.remove());
 const selectable=state.selected?validPieces(state.selected):[];
 state.players.forEach((pl,pi)=>{
   const groups=new Map();
   pl.pieces.forEach((p,idx)=>{
     const key=p.status==="board"?nodeOf(p):`${p.status}-${idx}`;
     if(!groups.has(key))groups.set(key,[]);groups.get(key).push(p)
   });
   groups.forEach(group=>{
     const p=group[0],idx=parseInt(p.id.split("-")[1]);let xy;
     if(p.status==="home")xy=homePos(pi,idx);else if(p.status==="finished")xy=finishPos(pi,idx);else xy=coords[nodeOf(p)];
     const b=document.createElement("button");b.className=`piece ${pl.color}`;b.style.left=xy[0]+"%";b.style.top=xy[1]+"%";b.type="button";
     if(pl.photo){const img=document.createElement("img");img.src=pl.photo;img.alt=pl.name;b.appendChild(img)}else b.textContent=idx+1;
     if(group.length>1){const c=document.createElement("span");c.className="count";c.textContent=group.length;b.appendChild(c)}
     if(selectable.some(x=>x.id===p.id)){b.classList.add("selectable");b.addEventListener("click",()=>movePiece(p.id));if(state.hintPieceId===p.id)b.classList.add("recommended")}
     $("board").appendChild(b)
   })
 });
 if(state.selected){const target=state.hintPieceId?state.players[state.current].pieces.find(p=>p.id===state.hintPieceId):validPieces(state.selected)[0];if(target)drawSuggestion(target,state.selected,!!state.hintPieceId)}
}

function renderPending(){
 const w=$("pendingList");w.innerHTML="";
 if(!state.pending.length){w.textContent=t("noThrows");return}
 state.pending.forEach(r=>{
   const b=document.createElement("button");b.className="chip";b.type="button";b.disabled=state.phase!=="move";
   b.textContent=`${resultName(r.type)} ${r.steps>0?"+":""}${r.steps}`;if(state.selected?.id===r.id)b.classList.add("active");
   b.addEventListener("click",()=>selectResult(r.id));w.appendChild(b)
 })
}

function renderRules(){
 const g=$("rulesGrid");g.innerHTML="";
 I18N[state.language].rulesList.forEach(([h,p])=>{const d=document.createElement("div");d.className="rule";d.innerHTML=`<h3>${h}</h3><p>${p}</p>`;g.appendChild(d)});
 $("rulesTitle").textContent=t("rulesTitle");$("closeRules").textContent=t("close");$("settingsTitle").textContent=t("settingsTitle")
}

function render(){
 const colors=["var(--blue)","var(--red)","var(--green)"];
 $("turnCard").style.setProperty("--turn-color",colors[state.current]);$("turnLabel").textContent=t("current");$("turnName").textContent=state.players[state.current].name;$("turnName").style.color=colors[state.current];
 state.players.forEach((p,i)=>{const rank=state.rankings.indexOf(i);$(`name${i}`).textContent=p.name;$(`finished${i}`).innerHTML=rank>=0?`<span class="rank-badge">${rank+1}${rank===0?"st":rank===1?"nd":"rd"}</span>`:`${p.pieces.filter(x=>x.status==="finished").length}/4`;$(`score${i}`).classList.toggle("active",state.current===i&&!state.rankings.includes(i));$(`score${i}`).style.setProperty("--score-color",colors[i])});
 $("soundBtn").textContent=`${state.sound?"🔊":"🔇"} ${t("sound")}`;$("soundBtn").classList.toggle("sound-on",state.sound);$("rulesBtn").textContent=t("rules");$("settingsBtn").textContent=t("settings");$("restartBtn").textContent=t("newGame");$("throwBtn").textContent=t("throw");$("movesTitle").textContent=t("moves");$("phaseText").textContent=state.phase==="throw"?t("throwPhase"):t("movePhase");$("logTitle").textContent=t("log");
 $("throwBtn").disabled=state.phase!=="throw"||state.gameOver||state.tossing;
 const lang=I18N[state.language], c=lang.colors;$("blueNameLabel").textContent=t("teamName",{color:c.blue});$("bluePhotoLabel").textContent=t("teamPhoto",{color:c.blue});$("redNameLabel").textContent=t("teamName",{color:c.red});$("redPhotoLabel").textContent=t("teamPhoto",{color:c.red});$("greenNameLabel").textContent=t("teamName",{color:c.green});$("greenPhotoLabel").textContent=t("teamPhoto",{color:c.green});$("languageLabel").textContent=t("language");$("backDoLabel").textContent=t("backDoSetting");$("soundLabel").textContent=t("soundEffects");$("cancelSettings").textContent=t("cancel");$("saveSettings").textContent=t("save");$("continueGame").textContent=t("continueGame");$("playAgain").textContent=t("playAgain");
 renderPending();renderPieces();renderRules();renderHint()
}

function open(id){$(id).classList.add("show")}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>$(b.dataset.close).classList.remove("show")));
$("rulesBtn").addEventListener("click",()=>open("rulesModal"));
$("settingsBtn").addEventListener("click",()=>{
 state.players.forEach((p,i)=>{$(`p${i}Name`).value=p.name;$(`p${i}Photo`).value=""});
 $("language").value=state.language;$("backDo").checked=state.backDo;$("soundEnabled").checked=state.sound;open("settingsModal")
});
function readPhoto(input){return new Promise(res=>{const f=input.files?.[0];if(!f)return res(null);const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f)})}
$("saveSettings").addEventListener("click",async()=>{
 for(let i=0;i<3;i++){state.players[i].name=$(`p${i}Name`).value.trim()||`Team ${i+1}`;const ph=await readPhoto($(`p${i}Photo`));if(ph)state.players[i].photo=ph}
 state.language=$("language").value;state.backDo=$("backDo").checked;state.sound=$("soundEnabled").checked;$("settingsModal").classList.remove("show");$("status").textContent=t("throwPrompt");render()
});
$("throwBtn").addEventListener("click",toss);$("hintBtn").addEventListener("click",showHint);$("soundBtn").addEventListener("click",()=>{state.sound=!state.sound;sound("click");render()});
$("restartBtn").addEventListener("click",()=>{if(confirm("Start a new game?"))reset()});
$("continueGame").addEventListener("click",()=>{$("winnerModal").classList.remove("show");state.current=nextActive(state.current);state.phase="throw";state.pending=[];state.selected=null;state.hintPieceId=null;$("resultText").textContent=t("ready");$("status").textContent=t("throwPrompt");render()});
$("playAgain").addEventListener("click",reset);
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{if(e.target===m&&m.id!=="winnerModal")m.classList.remove("show")}));

buildBoard();reset();
})();
</script>
</body>
</html>
